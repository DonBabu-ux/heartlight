
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Heart Assembly/Disassembly | Three.js</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Poppins', 'Segoe UI', Arial, sans-serif;
      background: #050510;
    }
    #info, #status, .instruction {
      position: absolute;
      z-index: 10;
      color: #fff;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(4px);
      pointer-events: none;
      border-radius: 999px;
    }
    .instruction {
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      padding: 6px 14px;
      font-size: 11px;
      text-align: center;
      white-space: nowrap;
    }
    #info {
      left: 12px;
      bottom: 12px;
      padding: 6px 12px;
      font-size: 11px;
    }
    #status {
      right: 12px;
      bottom: 12px;
      padding: 6px 12px;
      font-size: 11px;
      font-family: monospace;
    }
    @media (min-width: 768px) {
      .instruction { font-size: 13px; top: 20px; }
      #info, #status { font-size: 13px; padding: 8px 14px; }
      #info { left: 20px; bottom: 20px; }
      #status { right: 20px; bottom: 20px; }
    }
  </style>
</head>
<body>
  <div class="instruction">💗 I LOVE YOU 💗</div>
  <div id="info">Don the techie </div>
  <div id="status">Made by love </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from "three";
    import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
    import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
    import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050510);
    // Subtle fog to blend depth and avoid sharp edges, enhancing cohesion
    scene.fog = new THREE.FogExp2(0x050510, 0.0008);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 2000);
    camera.position.set(0, 0, 360);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ReinhardToneMapping;
    renderer.toneMappingExposure = 1.2;
    document.body.appendChild(renderer.domElement);

    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.0, 0.25, 0.8);
    bloomPass.threshold = 0.02;   // Lower threshold so subtle glow blends
    bloomPass.strength = 0.98;
    bloomPass.radius = 0.58;       // Softer radius for volumetric spread
    composer.addPass(bloomPass);

    const PINK_CORE = new THREE.Color(0xff2a5a);
    const PINK_MID = new THREE.Color(0xff4d6d);
    const PINK_WARM = new THREE.Color(0xff6b8e);

    function getResponsiveScale() {
      const w = window.innerWidth;
      if (w <= 420) return 3.8;
      if (w <= 768) return 4.4;
      return 5.2;
    }
    let SCALE = getResponsiveScale();

    function heartPoint(t) {
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
      return new THREE.Vector3(x * SCALE, y * SCALE, 0);
    }

    const PARTICLE_COUNT = 12000;   // slightly increased for smoother continuum
    const BUILD_DURATION = 6.8;
    const HOLD_DURATION = 1.2;
    const ERASE_DURATION = 6.8;
    const BLANK_DURATION = 0.9;
    const TOTAL_CYCLE = BUILD_DURATION + HOLD_DURATION + ERASE_DURATION + BLANK_DURATION;

    const ACTIVE_WIDTH = 0.12;
    const BUILD_BAND = 0.28;
    const ERASE_BAND = 0.28;

    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(PARTICLE_COUNT * 3);
    const colors = new Float32Array(PARTICLE_COUNT * 3);
    const particleData = [];

    const points = new THREE.Points(
      geometry,
      new THREE.PointsMaterial({
        size: window.innerWidth <= 768 ? 1.15 : 1.28,
        vertexColors: true,
        transparent: true,
        opacity: 0.98,
        blending: THREE.AdditiveBlending
      })
    );
    scene.add(points);

    // Unified ambient-like fill lights, no stark directional layers
    const ambientGlow = new THREE.AmbientLight(0x221133, 0.22);
    scene.add(ambientGlow);
    
    const fillLight = new THREE.PointLight(0xff3366, 0.28, 450);
    fillLight.position.set(12, 20, 45);
    scene.add(fillLight);
    
    const backFill = new THREE.PointLight(0xff6688, 0.19, 380);
    backFill.position.set(-8, -5, -55);
    scene.add(backFill);
    
    // A very soft moving light that subtly enhances upper curves without segmentation
    const dynamicFill = new THREE.PointLight(0xff5588, 0.22, 400);
    dynamicFill.position.set(0, 18, 28);
    scene.add(dynamicFill);

    function smoothstep(a, b, x) {
      const t = Math.max(0, Math.min(1, (x - a) / (b - a)));
      return t * t * (3 - 2 * t);
    }
    
    // Gaussian-like radial blending for intensity transitions
    function gaussianBlend(x, sigma = 0.32) {
      return Math.exp(-Math.pow(x, 2) / (2 * sigma * sigma));
    }

    function circularBehind(front, u) {
      return (front - u + 1) % 1;
    }

    function circularAhead(front, u) {
      return (u - front + 1) % 1;
    }

    function lerpVec(a, b, t) {
      return new THREE.Vector3(
        a.x + (b.x - a.x) * t,
        a.y + (b.y - a.y) * t,
        a.z + (b.z - a.z) * t
      );
    }

    // Generate particles with continuous distribution: edge-weighted with natural falloff to interior
    function weightedHeartTarget() {
      while (true) {
        const t = Math.random() * Math.PI * 2;
        const edge = heartPoint(t);
        
        const yNorm = (edge.y / (13 * SCALE) + 1) * 0.5;
        const absXNorm = Math.min(1, Math.abs(edge.x) / (16 * SCALE));
        
        // smoother lobe influence: continuous mask for upper outer curves without harsh cutoff
        const upperLobeInfluence = smoothstep(0.58, 0.96, yNorm) * 
                                   smoothstep(0.32, 0.92, absXNorm) * 
                                   (1 - smoothstep(0.0, 0.24, 1 - absXNorm) * 0.35);
        // contour closeness: from exact edge inward with continuous gradation
        let fill;
        if (Math.random() < 0.44) {
          // near-contour region
          fill = 0.92 + Math.pow(Math.random(), 1.4) * 0.08;
        } else {
          const base = 0.08 + yNorm * 0.09;
          fill = Math.sqrt(Math.random());
          fill = base + (1 - base) * fill;
        }
        fill = Math.min(0.99, Math.max(0.02, fill));
        
        // Continuous contour pull: doesn't create hard edge, just smooth bias
        const contourPull = smoothstep(0.68, 0.98, fill) * 0.48;
        const fx = fill * (1 - contourPull) + contourPull;
        
        const x = edge.x * fx;
        const y = edge.y * fx;
        
        // depth softening: outer regions slightly flatter depth, inner more volumetric
        const depthFactor = 0.5 + 0.5 * (1 - fill);
        
        // continuous luminance factor: unified blending
        let luminanceFactor = 0.54 + upperLobeInfluence * 0.34;
        // gradually reduce toward center but no step
        luminanceFactor = luminanceFactor * (0.85 + fill * 0.25);
        // ensure smooth maximum not exceeding natural range
        luminanceFactor = Math.min(0.98, luminanceFactor);
        
        return { x, y, t, contourPull, upperLobeInfluence, luminanceFactor, depthFactor };
      }
    }

    function buildParticles() {
      particleData.length = 0;
      const isMobile = window.innerWidth <= 768;
      const baseZRange = isMobile ? 5.4 : 6.6;
      
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const s = weightedHeartTarget();
        // z depth smoothly varying: no layer separation
        const zOffset = (Math.random() - 0.5) * baseZRange * (0.7 + s.depthFactor * 0.6);
        const target = new THREE.Vector3(s.x, s.y, zOffset);
        
        const sectionU = s.t / (Math.PI * 2);
        const fromDir = heartPoint(sectionU * Math.PI * 2).normalize();
        
        const spawn = target.clone().add(fromDir.clone().multiplyScalar(170 + Math.random() * 90));
        spawn.x += (Math.random() - 0.5) * 24;
        spawn.y += (Math.random() - 0.5) * 24;
        spawn.z = (Math.random() - 0.5) * 88;
        
        const drift = target.clone().add(fromDir.clone().multiplyScalar(160 + Math.random() * 140));
        drift.x += (Math.random() - 0.5) * 40;
        drift.y += (Math.random() - 0.5) * 40;
        drift.z = (Math.random() - 0.5) * 110;
        
        positions[i * 3] = spawn.x;
        positions[i * 3 + 1] = spawn.y;
        positions[i * 3 + 2] = spawn.z;
        
        // initial colors invisible
        colors[i * 3] = 0;
        colors[i * 3 + 1] = 0;
        colors[i * 3 + 2] = 0;
        
        particleData.push({
          sectionU,
          target,
          spawn,
          drift,
          upperLobeInfluence: s.upperLobeInfluence,
          contourPull: s.contourPull,
          luminanceFactor: s.luminanceFactor,
          depthFactor: s.depthFactor,
          swirlAmp: 2.1 + Math.random() * 4.5,
          seed: Math.random() * Math.PI * 2
        });
      }
      
      geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
      geometry.setAttribute("color", new THREE.BufferAttribute(colors, 3));
    }
    
    buildParticles();
    
    // Unified intensity calculation: smooth continuous blending, no discrete bands
    function computeUnifiedIntensity(d, phase, front, elapsed, isBehind, aheadDist, behindDist, isErasedZone) {
      // base intensity from phase progression, always smooth
      let intensity = 0;
      let posFactor = 1.0;
      
      if (phase === "build") {
        if (isBehind) {
          // built particles: intensity based on distance from front edge with smooth falloff
          const distToFront = behindDist;
          const nearCore = smoothstep(0, ACTIVE_WIDTH * 0.9, distToFront);
          const midGlow = smoothstep(0, BUILD_BAND * 0.7, distToFront);
          // combine with upperLobe continuous boost - no hard band
          let lobeBoost = d.upperLobeInfluence * 0.26 * (1 - distToFront * 0.6);
          lobeBoost = Math.min(0.28, lobeBoost);
          intensity = 0.38 + nearCore * 0.32 + midGlow * 0.22 + lobeBoost;
          // contour smoothness: slight extra near outer edge, but integrated
          intensity += d.contourPull * 0.06 * (1 - distToFront);
          intensity = Math.min(0.98, intensity);
        } else {
          // incoming particles: progressive approach
          const approachT = 1.0 - smoothstep(0, BUILD_BAND * 1.2, aheadDist);
          const lobeGlow = d.upperLobeInfluence * 0.18 * approachT;
          intensity = approachT * (0.44 + lobeGlow);
          intensity += d.contourPull * 0.04 * approachT;
        }
      } 
      else if (phase === "hold") {
        // constant unified brightness with slight micro-motion integrated
        let holdIntensity = 0.48 + d.upperLobeInfluence * 0.22 + d.contourPull * 0.05;
        holdIntensity = Math.min(0.94, holdIntensity);
        intensity = holdIntensity;
      } 
      else if (phase === "erase") {
        if (!isErasedZone) {
          // still built particles within unerased region
          const distToEraseFront = behindDist;
          const nearCoreGlow = smoothstep(0, ACTIVE_WIDTH, distToEraseFront);
          const midGlow = smoothstep(0, ERASE_BAND * 0.65, distToEraseFront);
          let lobeBoost = d.upperLobeInfluence * 0.24 * (1 - distToEraseFront * 0.5);
          lobeBoost = Math.min(0.26, lobeBoost);
          intensity = 0.36 + nearCoreGlow * 0.30 + midGlow * 0.18 + lobeBoost;
          intensity += d.contourPull * 0.05;
          intensity = Math.min(0.94, intensity);
        } else {
          // erasing: smooth transition outward
          const detachProg = smoothstep(0, ACTIVE_WIDTH * 0.9, behindDist);
          const flyProg = smoothstep(ACTIVE_WIDTH * 0.5, ERASE_BAND * 1.1, behindDist);
          const fadingIntensity = Math.max(0, (1 - flyProg * 1.2) * (0.68 + d.upperLobeInfluence * 0.18));
          intensity = fadingIntensity * (1 - detachProg * 0.7);
          if (flyProg > 0.85) intensity *= (1 - (flyProg - 0.85) / 0.2);
        }
      } 
      else { // blank
        intensity = 0;
      }
      
      // final clamp and subtle temporal flicker for organic unity (non banded)
      let flicker = 0.95 + Math.sin(elapsed * 2.4 + d.seed) * 0.045;
      intensity = Math.max(0, Math.min(0.99, intensity * flicker));
      return intensity;
    }
    
    function updateFrame(elapsed) {
      const cycle = elapsed % TOTAL_CYCLE;
      const status = document.getElementById("status");
      
      let phase = "build";
      let front = 0;
      
      if (cycle < BUILD_DURATION) {
        phase = "build";
        front = cycle / BUILD_DURATION;
        status.textContent = "Phase: Build";
      } else if (cycle < BUILD_DURATION + HOLD_DURATION) {
        phase = "hold";
        front = 1;
        status.textContent = "Phase: Hold";
      } else if (cycle < BUILD_DURATION + HOLD_DURATION + ERASE_DURATION) {
        phase = "erase";
        front = (cycle - BUILD_DURATION - HOLD_DURATION) / ERASE_DURATION;
        status.textContent = "Phase: Erase";
      } else {
        phase = "blank";
        status.textContent = "Phase: Blank";
      }
      
      const pos = geometry.attributes.position.array;
      const col = geometry.attributes.color.array;
      
      // smoothly animate dynamic fill to enhance upper curves without segmentation
      const lobePulse = 0.18 + Math.sin(elapsed * 0.62) * 0.045;
      dynamicFill.intensity = 0.21 + lobePulse * 0.08;
      dynamicFill.position.x = Math.sin(elapsed * 0.37) * 5;
      dynamicFill.position.y = 16 + Math.sin(elapsed * 0.51) * 3;
      
      // slight overall bloom strength modulation
      const bloomStrengthBase = (phase === "blank") ? 0.15 : 0.96;
      bloomPass.strength = bloomStrengthBase + Math.sin(elapsed * 0.4) * 0.04;
      
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const d = particleData[i];
        const behindDist = circularBehind(front, d.sectionU);
        const aheadDist = circularAhead(front, d.sectionU);
        const isBehind = behindDist <= front;
        const isErasedZone = (phase === "erase") ? (behindDist <= front) : false;
        
        let outPos = d.spawn.clone();
        let intensity = 0;
        
        if (phase === "build") {
          if (isBehind) {
            // fully formed: stable at target with gentle micro motion (cohesive)
            outPos = d.target.clone();
            const microJitter = 0.06 * (1 - d.contourPull * 0.5);
            outPos.x += Math.sin(elapsed * 4.8 + d.seed) * 0.04 * microJitter;
            outPos.y += Math.cos(elapsed * 5.2 + d.seed * 1.1) * 0.04 * microJitter;
            outPos.z += Math.sin(elapsed * 4.1 + d.seed * 0.9) * 0.08 * microJitter;
          } else {
            const approachT = Math.max(0, Math.min(1, 1.0 - smoothstep(0, BUILD_BAND * 1.1, aheadDist)));
            outPos = lerpVec(d.spawn, d.target, approachT);
            const swirlFactor = (d.swirlAmp * 0.9) * (1 - approachT);
            outPos.x += Math.sin(elapsed * 9.2 + d.seed) * swirlFactor;
            outPos.y += Math.cos(elapsed * 8.7 + d.seed * 1.2) * swirlFactor;
            outPos.z += Math.sin(elapsed * 7.5 + d.seed * 0.8) * swirlFactor * 0.7;
          }
          intensity = computeUnifiedIntensity(d, phase, front, elapsed, isBehind, aheadDist, behindDist, false);
        } 
        else if (phase === "hold") {
          outPos = d.target.clone();
          // very subtle uniform vibration, unifies particles
          const gentle = 0.022 * (1 - d.contourPull * 0.3);
          outPos.x += Math.sin(elapsed * 2.3 + d.seed) * gentle;
          outPos.y += Math.cos(elapsed * 2.7 + d.seed * 1.2) * gentle;
          outPos.z += Math.sin(elapsed * 2.0 + d.seed * 0.5) * gentle * 0.6;
          intensity = computeUnifiedIntensity(d, phase, front, elapsed, true, 0, behindDist, false);
        } 
        else if (phase === "erase") {
          if (!isErasedZone) {
            outPos = d.target.clone();
            const microJitter = 0.07 * (1 - d.contourPull * 0.4);
            outPos.x += Math.sin(elapsed * 5.5 + d.seed) * 0.05 * microJitter;
            outPos.y += Math.cos(elapsed * 5.0 + d.seed * 1.3) * 0.05 * microJitter;
            outPos.z += Math.sin(elapsed * 4.3 + d.seed * 0.7) * 0.09 * microJitter;
            intensity = computeUnifiedIntensity(d, phase, front, elapsed, true, 0, behindDist, false);
          } else {
            const detachT = smoothstep(0, ACTIVE_WIDTH * 1.1, behindDist);
            const flyT = smoothstep(ACTIVE_WIDTH * 0.45, ERASE_BAND * 1.25, behindDist);
            const detachPos = d.target.clone();
            const scatter = (2.2 + d.swirlAmp * 0.8 + d.upperLobeInfluence * 1.0) * detachT;
            detachPos.x += Math.sin(elapsed * 10 + d.seed) * scatter;
            detachPos.y += Math.cos(elapsed * 9.2 + d.seed * 1.2) * scatter;
            detachPos.z += Math.sin(elapsed * 8.1 + d.seed * 0.9) * scatter * 0.65;
            outPos = lerpVec(detachPos, d.drift, flyT);
            intensity = computeUnifiedIntensity(d, phase, front, elapsed, true, 0, behindDist, true);
          }
        } 
        else {
          outPos = d.drift.clone();
          intensity = 0;
        }
        
        pos[i * 3] = outPos.x;
        pos[i * 3 + 1] = outPos.y;
        pos[i * 3 + 2] = outPos.z;
        
        // Enhanced color blending: from warm pink to rich carmine, gradients unified
        let r = PINK_CORE.r;
        let g = PINK_CORE.g;
        let b = PINK_CORE.b;
        
        if (intensity > 0.02) {
          // dynamic color mixing that feels like one continuous emission field
          const upperWarmth = d.upperLobeInfluence * 0.32;
          const innerCoreBoost = (1 - d.contourPull) * 0.18;
          const mixR = PINK_WARM.r * upperWarmth + PINK_MID.r * innerCoreBoost + PINK_CORE.r * (1 - (upperWarmth + innerCoreBoost) * 0.5);
          const mixG = PINK_WARM.g * upperWarmth + PINK_MID.g * innerCoreBoost + PINK_CORE.g * (1 - (upperWarmth + innerCoreBoost) * 0.4);
          const mixB = PINK_WARM.b * upperWarmth + PINK_MID.b * innerCoreBoost + PINK_CORE.b * (1 - (upperWarmth + innerCoreBoost) * 0.3);
          
          const intensityClamped = Math.min(1.0, intensity * 1.05);
          col[i * 3] = mixR * intensityClamped;
          col[i * 3 + 1] = mixG * intensityClamped * 0.92; // slight pinkish bias
          col[i * 3 + 2] = mixB * intensityClamped * 0.86;
        } else {
          col[i * 3] = 0;
          col[i * 3 + 1] = 0;
          col[i * 3 + 2] = 0;
        }
      }
      
      // unified light orbs that move along the front edge continuously (no layered look)
      const sparkPos = heartPoint((front % 1) * Math.PI * 2);
      fillLight.position.set(sparkPos.x * 0.38, sparkPos.y * 0.38 + 6, 42);
      fillLight.intensity = (phase === "blank") ? 0.03 : 0.27 + Math.sin(elapsed * 1.8) * 0.04;
      backFill.intensity = (phase === "blank") ? 0.0 : 0.17;
      
      geometry.attributes.position.needsUpdate = true;
      geometry.attributes.color.needsUpdate = true;
    }
    
    function reflow() {
      SCALE = getResponsiveScale();
      buildParticles();
      points.material.size = window.innerWidth <= 768 ? 1.15 : 1.28;
      camera.position.z = window.innerWidth <= 768 ? 320 : 360;
      camera.position.x = 0;
      camera.position.y = 0;
      camera.lookAt(0, -1, 0);
    }
    
    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      composer.setSize(window.innerWidth, window.innerHeight);
      reflow();
    }
    
    window.addEventListener("resize", onResize);
    
    let lastTime = performance.now() * 0.001;
    function animate() {
      const now = performance.now() * 0.001;
      let delta = Math.min(0.033, now - lastTime);
      lastTime = now;
      updateFrame(now);
      
      // gentle camera oscillation to increase volumetric feel without layer separation
      camera.position.x += (0 - camera.position.x) * 0.055;
      camera.position.y += (Math.sin(now * 0.12) * 1.2 - camera.position.y) * 0.03;
      camera.lookAt(0, -1, 0);
      
      composer.render();
      requestAnimationFrame(animate);
    }
    
    animate();
  </script>
</body>
</html>
